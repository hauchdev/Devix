name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

# Only what the release needs. Anything wider is a credential waiting to
# be misused by a compromised dependency.
permissions:
  contents: read

jobs:
  release:
    name: Release to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm provenance: the registry verifies the build
      # against this workflow's identity.
      id-token: write
      # The changesets action opens the "Version Packages" PR when there
      # are pending changesets, which needs pull request write access.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The changesets action needs history and a full token to push
          # version commits and tags.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify
        run: pnpm verify

      - name: Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # --provenance links the published tarballs to this workflow
          # run, so consumers can verify they were built from this repo.
          publish: pnpm exec changeset publish --provenance
          version: pnpm exec changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published packages
        if: steps.changesets.outputs.published == 'true'
        run: |
          node scripts/verify-published.mjs ${{ steps.changesets.outputs.publishedPackages }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

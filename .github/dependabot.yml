version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for the lint/format toolchain: they are upgraded together
      # and splitting them produces broken intermediate states.
      linting:
        patterns:
          - "eslint*"
          - "prettier"
          - "typescript"
          - "typescript-eslint"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      actions:
        patterns:
          - "actions/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
